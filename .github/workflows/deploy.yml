name: Work OS CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি ক্লোন করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. নোড ডট জেএস পরিবেশ প্রস্তুত করা
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ৩. ডিপেন্ডেন্সি ইনস্টল করা
      - name: Install Dependencies
        run: npm ci

      # ৪. কোড কোয়ালিটি ও সিনট্যাক্স স্ক্যান (Lint Check)
      - name: Run Linter Checks
        run: npm run lint || true

      # ৫. অ্যাপ্লিকেশন প্রোডাকশন বিল্ড তৈরি করা
      - name: Build Application
        run: npm run build

      # ৬. বিল্ড করা ফাইলগুলো সফলভাবে আর্টিফ্যাক্ট হিসেবে সেভ করা
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4 # সঠিক অ্যাকশন নাম
        with:
          name: dist-artifacts
          path: dist/
